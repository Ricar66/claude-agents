<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">claude-agents</title>
  <desc id="d">Four subagents for Claude Code: security-sentinel and infra-guardian only read; backend-architect and frontend-architect design and, when asked, implement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#131D33"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1E2A44"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <text x="80" y="112" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="22" fill="#7DD3FC">~/.claude/agents/</text>
  <text x="80" y="192" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#F8FAFC">claude-agents</text>
  <text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#CBD5E1">
    <tspan x="80" y="246">Four subagents for Claude Code: two auditors that only read,</tspan>
    <tspan x="80" y="284">two architects that design and, when asked, implement.</tspan>
  </text>

  <!-- security-sentinel -->
  <g transform="translate(80 340)">
    <rect width="260" height="200" rx="16" fill="#0F172A" stroke="#F87171" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="1" y="1" width="258" height="6" rx="3" fill="#F87171"/>
    <g transform="translate(28 30)" fill="none" stroke="#F87171" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 2 L36 8 V20 C36 30 29 36 20 39 C11 36 4 30 4 20 V8 Z"/>
      <path d="M13 20 L18 25 L27 15"/>
    </g>
    <text x="28" y="118" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" fill="#F8FAFC">security-sentinel</text>
    <text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#94A3B8">
      <tspan x="28" y="150">Security audit</tspan>
      <tspan x="28" y="174">11 modes · read-only</tspan>
    </text>
  </g>

  <!-- infra-guardian -->
  <g transform="translate(366 340)">
    <rect width="260" height="200" rx="16" fill="#0F172A" stroke="#4ADE80" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="1" y="1" width="258" height="6" rx="3" fill="#4ADE80"/>
    <g transform="translate(28 30)" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="32" height="13" rx="3"/>
      <rect x="4" y="23" width="32" height="13" rx="3"/>
      <path d="M10 10.5 H10.1 M10 29.5 H10.1 M22 10.5 H30 M22 29.5 H30"/>
    </g>
    <text x="28" y="118" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" fill="#F8FAFC">infra-guardian</text>
    <text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#94A3B8">
      <tspan x="28" y="150">Infrastructure &amp; reliability</tspan>
      <tspan x="28" y="174">17 modes · read-only</tspan>
    </text>
  </g>

  <!-- backend-architect -->
  <g transform="translate(652 340)">
    <rect width="260" height="200" rx="16" fill="#0F172A" stroke="#60A5FA" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="1" y="1" width="258" height="6" rx="3" fill="#60A5FA"/>
    <g transform="translate(28 30)" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="20" cy="8" rx="15" ry="5"/>
      <path d="M5 8 V32 C5 35 12 37 20 37 C28 37 35 35 35 32 V8"/>
      <path d="M5 20 C5 23 12 25 20 25 C28 25 35 23 35 20"/>
    </g>
    <text x="28" y="118" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" fill="#F8FAFC">backend-architect</text>
    <text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#94A3B8">
      <tspan x="28" y="150">APIs, data, migrations</tspan>
      <tspan x="28" y="174">15 modes · implements</tspan>
    </text>
  </g>

  <!-- frontend-architect -->
  <g transform="translate(938 340)">
    <rect width="260" height="200" rx="16" fill="#0F172A" stroke="#C084FC" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="1" y="1" width="258" height="6" rx="3" fill="#C084FC"/>
    <g transform="translate(28 30)" fill="none" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="34" height="30" rx="4"/>
      <path d="M3 13 H37 M9 20 H21 M9 27 H17"/>
      <rect x="25" y="19" width="7" height="10" rx="1.5"/>
    </g>
    <text x="28" y="118" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="700" fill="#F8FAFC">frontend-architect</text>
    <text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#94A3B8">
      <tspan x="28" y="150">Interfaces &amp; accessibility</tspan>
      <tspan x="28" y="174">17 modes · implements</tspan>
    </text>
  </g>

  <text x="80" y="596" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#64748B">pt-BR · en   ·   evidence before claims   ·   your org context stays local   ·   Apache-2.0</text>
</svg>
